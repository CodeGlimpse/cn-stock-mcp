name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q -m "not live"

      - name: Build package
        run: python -m build

      - name: Wheel install smoke
        run: |
          python -m venv /tmp/cn-stock-mcp-wheel-smoke
          /tmp/cn-stock-mcp-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/cn-stock-mcp-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/cn-stock-mcp-wheel-smoke/bin/cn-stock-mcp --version
          /tmp/cn-stock-mcp-wheel-smoke/bin/cn-stock-mcp --doctor
          /tmp/cn-stock-mcp-wheel-smoke/bin/cn-stock-mcp --list-tools
