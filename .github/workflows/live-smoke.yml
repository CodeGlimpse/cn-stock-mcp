name: Live Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: live-smoke
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check ZHITU_TOKEN
        id: token_check
        env:
          ZHITU_TOKEN: ${{ secrets.ZHITU_TOKEN }}
        run: |
          if [ -n "$ZHITU_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZHITU_TOKEN is missing; skipping live smoke tests for manual run."
          fi

      - name: Run live smoke
        if: steps.token_check.outputs.has_token == 'true'
        env:
          ZHITU_TOKEN: ${{ secrets.ZHITU_TOKEN }}
        run: |
          bash scripts/smoke_live.sh
