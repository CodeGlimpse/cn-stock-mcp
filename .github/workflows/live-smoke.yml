name: Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: live-smoke
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run live smoke
        env:
          ZHITU_TOKEN: ${{ secrets.ZHITU_TOKEN }}
        run: |
          bash scripts/smoke_live.sh
