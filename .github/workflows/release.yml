name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-wheel-smoke:
    runs-on: windows-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-release.txt
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Install wheel in a clean venv and smoke MCP
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "cn-stock-mcp-release"
          $config = Join-Path $env:RUNNER_TEMP "cn-stock-mcp-release-config.json"
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install $wheel.FullName
          $env:CN_STOCK_MCP_CONFIG = $config
          & "$venv\Scripts\cn-stock-mcp.exe" --init-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& "$venv\Scripts\cn-stock-mcp.exe" --version).Trim()
          $expectedVersion = "${{ github.ref_name }}".Substring(1)
          $doctor = (& "$venv\Scripts\cn-stock-mcp.exe" --doctor --json) -join "`n" | ConvertFrom-Json
          $tools = (& "$venv\Scripts\cn-stock-mcp.exe" --list-tools --json) -join "`n" | ConvertFrom-Json
          $docsPath = (& "$venv\Scripts\cn-stock-mcp.exe" --docs-path).Trim()
          $expectedTools = @("stock_search", "market_brief", "stock_snapshot", "stock_quote", "stock_history", "stock_review", "watchlist_review", "trading_calendar", "sector_review", "hot_theme_tracker")
          $actualTools = @($tools | ForEach-Object { $_.name })
          if ($version -ne $expectedVersion -or $doctor.exit_code -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $docsPath "CUSTOMER_DEPLOYMENT.md")) -or @($actualTools).Count -ne 10 -or (@($actualTools | Where-Object { $_ -notin $expectedTools }).Count -ne 0) -or (@($expectedTools | Where-Object { $_ -notin $actualTools }).Count -ne 0)) { exit 1 }
          & "$venv\Scripts\python.exe" scripts/verify_mcp_stdio.py --command "$venv\Scripts\cn-stock-mcp.exe" --expected-tools 10 --expected-version $expectedVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          icacls $config

  build-audit-publish:
    needs: windows-wheel-smoke
    runs-on: ubuntu-latest
    environment: pypi
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-release.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pip-audit cyclonedx-bom

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify tag and package versions
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          test "$TAG_VERSION" = "v$(python -c 'import importlib.metadata; print(importlib.metadata.version("cn-stock-mcp"))')"

      - name: Run non-live tests
        run: python -m pytest -q -m "not live"

      - name: Audit project and release tool dependencies
        run: |
          python -m pip_audit --strict .
          python -m pip_audit --strict -r constraints-release.txt

      - name: Build distributions
        run: python -m build

      - name: Generate checksums and SBOM
        run: |
          cyclonedx-py environment --pyproject pyproject.toml --output-reproducible --output-format JSON --output-file sbom.json
          (cd dist && sha256sum *) > sha256sums.txt
          sha256sum sbom.json >> sha256sums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* sha256sums.txt sbom.json --clobber
          else
            notes_file="docs/RELEASE_NOTE_${GITHUB_REF_NAME}.md"
            if [ -f "$notes_file" ]; then
              gh release create "$GITHUB_REF_NAME" dist/* sha256sums.txt sbom.json \
                --verify-tag --title "cn-stock-mcp $GITHUB_REF_NAME" --notes-file "$notes_file"
            else
              gh release create "$GITHUB_REF_NAME" dist/* sha256sums.txt sbom.json \
                --verify-tag --title "cn-stock-mcp $GITHUB_REF_NAME" --generate-notes
            fi
          fi
