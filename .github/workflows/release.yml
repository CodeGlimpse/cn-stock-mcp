name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build and audit tools
        run: python -m pip install --upgrade build pip-audit cyclonedx-bom

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify tag and package versions
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          test "$TAG_VERSION" = "v$(python -c 'import importlib.metadata; print(importlib.metadata.version("cn-stock-mcp"))')"

      - name: Run non-live tests
        run: python -m pytest -q -m "not live"

      - name: Audit installed dependencies
        run: python -m pip_audit --strict

      - name: Build distributions
        run: python -m build

      - name: Generate checksums and SBOM
        run: |
          sha256sum dist/* > sha256sums.txt
          cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* sha256sums.txt sbom.json \
            --verify-tag \
            --title "cn-stock-mcp $GITHUB_REF_NAME" \
            --generate-notes
