name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-wheel-smoke:
    runs-on: windows-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-release.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Install wheel in a clean venv and smoke MCP
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "cn-stock-mcp-v020"
          $config = Join-Path $env:RUNNER_TEMP "cn-stock-mcp-v020-config.json"
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install $wheel.FullName
          $env:CN_STOCK_MCP_CONFIG = $config
          & "$venv\Scripts\cn-stock-mcp.exe" --init-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& "$venv\Scripts\cn-stock-mcp.exe" --version).Trim()
          $doctor = (& "$venv\Scripts\cn-stock-mcp.exe" --doctor --json) -join "`n" | ConvertFrom-Json
          $tools = (& "$venv\Scripts\cn-stock-mcp.exe" --list-tools --json) -join "`n" | ConvertFrom-Json
          if ($version -ne "0.2.0" -or $doctor.exit_code -ne 0 -or @($tools).Count -ne 10) { exit 1 }
          & "$venv\Scripts\python.exe" -c "import asyncio; from cn_stock_mcp.server.stdio_server import build_fastmcp_server; s=build_fastmcp_server(); h=s.get_request_handler('tools/list'); r=asyncio.run(h.handler(None, None)); assert len(r.tools) == 10"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          icacls $config

  build-audit-publish:
    needs: windows-wheel-smoke
    runs-on: ubuntu-latest
    environment: pypi
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-release.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pip-audit cyclonedx-bom

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify tag and package versions
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          test "$TAG_VERSION" = "v$(python -c 'import importlib.metadata; print(importlib.metadata.version("cn-stock-mcp"))')"

      - name: Run non-live tests
        run: python -m pytest -q -m "not live"

      - name: Audit project and release tool dependencies
        run: |
          python -m pip_audit --strict .
          python -m pip_audit --strict -r constraints-release.txt

      - name: Build distributions
        run: python -m build

      - name: Generate checksums and SBOM
        run: |
          cyclonedx-py environment --pyproject pyproject.toml --output-reproducible --output-format JSON --output-file sbom.json
          sha256sum dist/* sbom.json > sha256sums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* sha256sums.txt sbom.json \
            --verify-tag \
            --title "cn-stock-mcp $GITHUB_REF_NAME" \
            --generate-notes
