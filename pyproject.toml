[project]
name = "cn-stock-mcp"
version = "0.2.0"
description = "MCP server for Chinese market data via AKShare and Zhitu"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CodeGlimpse" }]
keywords = ["mcp", "china-stock", "market-data", "akshare", "zhitu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "cachetools>=5.4.0",
  "orjson>=3.10.0",
  "akshare>=1.15.0",
  "mcp[cli]>=2.0.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "respx>=0.21.1",
  "pytest-asyncio>=0.24.0",
  "build>=1.2.2",
]

[project.scripts]
cn-stock-mcp = "cn_stock_mcp.main:main"

[project.urls]
Homepage = "https://github.com/CodeGlimpse/cn-stock-mcp"
Documentation = "https://github.com/CodeGlimpse/cn-stock-mcp/tree/main/docs"
Issues = "https://github.com/CodeGlimpse/cn-stock-mcp/issues"
Changelog = "https://github.com/CodeGlimpse/cn-stock-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: tests requiring network/real upstream providers",
  "smoke: short high-signal live checks",
  "slow: slower or broader live regression checks",
  "transport: MCP transport/tool layer checks",
  "provider: direct upstream provider checks",
]
