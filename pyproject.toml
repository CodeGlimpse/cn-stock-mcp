[project]
name = "cn-stock-mcp"
version = "0.1.0"
description = "MCP server for Chinese market data via AKShare and Zhitu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "cachetools>=5.4.0",
  "orjson>=3.10.0",
  "akshare>=1.15.0",
  "mcp[cli]>=1.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "respx>=0.21.1",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: tests requiring network/real upstream providers",
  "smoke: short high-signal live checks",
  "slow: slower or broader live regression checks",
  "transport: MCP transport/tool layer checks",
  "provider: direct upstream provider checks",
]
